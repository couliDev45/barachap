<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BaraChap - Trouvez un professionnel facilement</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/logo/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/favicon-180.png" />
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#FF8C42" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BaraChap" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body>
    <barachap-header class="header"></barachap-header>

    <main>
      <section class="dashboard">
        <div class="section-title">
          <h2>Tableau de bord Client</h2>
          <p id="clientGreeting">Bonjour, Sherlock</p>
        </div>
        <div class="profile-progress">
          <div class="progress-header">
            <h3>Complétion du profil</h3>
            <span id="progressValue">80%</span>
          </div>

          <div class="progress-bar">
            <div class="progress-fill"></div>
          </div>
        </div>

        <!-- Accès à la gestion complète du compte (email, photo, mot de
             passe...) — centralisé sur une page dédiée plutôt que dispersé
             ici, voir pages/mon-compte.html -->
        <div style="max-width: 700px; margin: 0 auto 30px; text-align: center;">
          <a href="mon-compte.html" class="btn-secondary" style="text-decoration: none; display: inline-block;">⚙️ Gérer mon compte</a>
        </div>

        <div class="dashboard-stats">
          <div class="stat-card stat-total">
            <span class="stat-card-icone">📋</span>
            <div class="stat-card-texte">
              <h3>Total demandes</h3>
              <p id="totalDemandes">0</p>
            </div>
          </div>

          <div class="stat-card stat-attente">
            <span class="stat-card-icone">⏳</span>
            <div class="stat-card-texte">
              <h3>En attente</h3>
              <p id="attenteDemandes">0</p>
            </div>
          </div>

          <div class="stat-card stat-acceptee">
            <span class="stat-card-icone">✅</span>
            <div class="stat-card-texte">
              <h3>Acceptées</h3>
              <p id="accepteesDemandes">0</p>
            </div>
          </div>

          <div class="stat-card stat-refusee">
            <span class="stat-card-icone">❌</span>
            <div class="stat-card-texte">
              <h3>Refusées</h3>
              <p id="refuseesDemandes">0</p>
            </div>
          </div>
        </div>

        <h3 class="dashboard-title">Mes demandes</h3>

        <!-- Formulaire d'avis — masqué par défaut, ouvert depuis le bouton
             "Laisser un avis" d'une carte de demande acceptée (voir dashboard.js) -->
        <div id="formAvis" class="demande-form" style="display: none; max-width: 700px; margin: 0 auto 30px;">
          <h3 style="margin-bottom: 20px;">Laisser un avis</h3>
          <label for="avisNoteInput">Note</label>
          <select id="avisNoteInput">
            <option value="5">5 - Excellent</option>
            <option value="4">4 - Très bien</option>
            <option value="3">3 - Correct</option>
            <option value="2">2 - Décevant</option>
            <option value="1">1 - Très décevant</option>
          </select>
          <label for="avisCommentaireInput">Commentaire (facultatif)</label>
          <textarea id="avisCommentaireInput" rows="3" placeholder="Votre expérience avec ce prestataire..."></textarea>
          <div id="avisFormMessage"></div>
          <button class="btn-primary" id="btnValiderAvis" type="button">Envoyer mon avis</button>
        </div>

        <div id="listeDemandes" class="dashboard-container"></div>
        <!-- Le conteneur #dashboardStats a été retiré : il faisait doublon
             avec le bloc .dashboard-stats ci-dessus, rempli par le même
             dashboard.js via les IDs #totalDemandes / #attenteDemandes /
             #accepteesDemandes / #refuseesDemandes. -->
        <div id="loader">
          <div class="spinner"></div>

          <p>Chargement de BaraChap...</p>
        </div>
      </section>
    </main>
    <barachap-footer class="findepage"></barachap-footer>
    <script type="module" src="../js/main.js"></script>
    <div id="notification" class="notification">
      <span id="notification-message"></span>
    </div>
  </body>
</html>
