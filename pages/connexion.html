<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion - BaraChap</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/logo/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/favicon-180.png" />
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#FF8C42" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BaraChap" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body>
    <barachap-header class="header"></barachap-header>

    <main>
      <section class="auth-container">
        <div class="auth-card">
          <h2>Connexion à BaraChap</h2>
          <p class="auth-subtitle">
            Accédez à votre espace pour gérer vos demandes et services
          </p>

          <form id="connexionForm" class="auth-form">
            <div>
              <label for="identifiant">Numéro de téléphone ou Email</label>
              <input
                type="text"
                id="identifiant"
                name="identifiant"
                placeholder="Ex: 0708091011 ou exemple@email.com"
                required
              />
            </div>

            <div>
              <label for="motdepasse">Mot de passe</label>
              <input
                type="password"
                id="motdepasse"
                name="motdepasse"
                placeholder="Entrez votre mot de passe"
                required
              />
              <p style="text-align: right; margin-top: 8px;">
                <a href="mot-de-passe-oublie.html" style="font-size: 13px; color: var(--orange-primary); text-decoration: none; font-weight: 700;">Mot de passe oublié ?</a>
              </p>
            </div>

            <div>
              <label for="typeCompte">Se connecter en tant que</label>
              <select id="typeCompte" name="typeCompte" required>
                <option value="client" selected>Client (Je cherche un service)</option>
                <option value="prestataire">Prestataire (Je propose un service)</option>
              </select>
            </div>

            <div id="connexionMessage"></div>

            <button type="submit" class="btn-primary" style="width: 100%;">
              Se connecter
            </button>
          </form>

          <div class="auth-footer">
            <p>
              Vous n'avez pas encore de compte ?
              <a href="inscription.html" id="lienVersInscription">Créer un compte</a>
            </p>
          </div>
        </div>
      </section>
    </main>

    <barachap-footer class="findepage"></barachap-footer>

    <script type="module" src="../js/main.js"></script>
    <div id="notification" class="notification">
      <span id="notification-message"></span>
    </div>
  </body>
</html>
